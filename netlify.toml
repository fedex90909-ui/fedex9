# Netlify configuration for the FedEx demo (Vite SPA).
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# SPA routing: every deep link (e.g. /track, /ship, /account, /admin)
# is served by the React app instead of producing a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (baseline hardening for the static app).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
